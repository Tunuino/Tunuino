plugins { id 'com.android.application' }

android {
    namespace 'io.tunuino.android'
    compileSdk 35
    defaultConfig {
        applicationId 'io.tunuino.android'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        buildConfigField 'String', 'SOURCE_COMMIT', '"' + providers.environmentVariable('GITHUB_SHA').getOrElse('development') + '"'
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lint { abortOnError true }
}
dependencies {
    implementation 'androidx.core:core:1.15.0'
    testImplementation 'junit:junit:4.13.2'
}
