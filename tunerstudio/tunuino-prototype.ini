; Experimental TunerStudio definition, not yet verified against TunerStudio.
[MegaTune]
   MTversion      = 2.25
   queryCommand   = "S"
   signature      = "Tunuino-TS-0.1"

[Constants]
   pageSize       = 0

[OutputChannels]
   ochBlockSize   = 8
   ochGetCommand  = "A"
   rpmRaw         = scalar, U16, 0, "rpm", 1, 0
   mapRaw         = scalar, U16, 2, "kPa", 0.1, 0
   batteryRaw     = scalar, U16, 4, "V", 0.01, 0

[GaugeConfigurations]
   rpmGauge       = rpmRaw, "Engine Speed", "RPM", 0, 8000, 1000, 6500, 7000, 8000, 0, 0
   mapGauge       = mapRaw, "Manifold Pressure", "kPa", 0, 300, 0, 220, 250, 300, 1, 1
   batteryGauge   = batteryRaw, "Battery Voltage", "V", 0, 18, 10, 11, 15, 16, 2, 2
