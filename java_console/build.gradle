plugins { id 'java-library'; id 'application' }
def os = System.getProperty('os.name').toLowerCase()
def arm = System.getProperty('os.arch').contains('aarch64')
def platform = os.contains('windows') ? 'win' : os.contains('mac') ? (arm ? 'mac-aarch64' : 'mac') : (arm ? 'linux-aarch64' : 'linux')
dependencies {
    implementation 'com.fazecast:jSerialComm:2.11.4'
    ['base', 'graphics', 'controls'].each {
        implementation "org.openjfx:javafx-${it}:21.0.8:${platform}"
    }
}
application { mainClass = 'io.tunuino.console.Launcher' }
tasks.named('jar') {
    manifest { attributes 'Implementation-Version': providers.environmentVariable('GITHUB_SHA').getOrElse('development') }
}
tasks.named('check') { dependsOn ':checkCore' }
