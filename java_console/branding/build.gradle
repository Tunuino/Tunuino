plugins {
    id 'java-library'
}

tasks.register('smokeTest', JavaExec) {
    group = 'verification'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.tunuino.console.ConsoleBrandingSmokeTest'
}

tasks.register('artworkTest', JavaExec) {
    group = 'verification'
    systemProperty 'java.awt.headless', 'true'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.tunuino.console.ArtworkSmokeTest'
}

tasks.register('windowBrandingTest', JavaExec) {
    group = 'verification'
    systemProperty 'java.awt.headless', 'true'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.tunuino.console.ConsoleWindowBrandingSmokeTest'
}

tasks.register('supportTest', JavaExec) {
    group = 'verification'
    systemProperty 'java.awt.headless', 'true'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.tunuino.console.ConsoleBrandingSupportSmokeTest'
}

tasks.register('autotuneTest', JavaExec) {
    group = 'verification'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.tunuino.console.AutotuneCalculatorSmokeTest'
}

tasks.register('veMapCellTest', JavaExec) {
    group = 'verification'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.tunuino.console.VeMapCellSelectorSmokeTest'
}

tasks.register('lambdaFilterTest', JavaExec) {
    group = 'verification'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.tunuino.console.LambdaSampleFilterSmokeTest'
}

tasks.register('preview', JavaExec) {
    group = 'application'
    description = 'Preview the blue-and-white Tunuino Swing branding'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.tunuino.console.BrandingPreview'
}

tasks.named('check') {
    dependsOn tasks.named('smokeTest'), tasks.named('artworkTest'), tasks.named('windowBrandingTest'), tasks.named('supportTest'), tasks.named('autotuneTest'), tasks.named('veMapCellTest'), tasks.named('lambdaFilterTest')
}
