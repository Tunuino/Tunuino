plugins {
    id 'java-library'
}

dependencies {
    api project(':branding')
}

tasks.register('smokeTest', JavaExec) {
    group = 'verification'
    systemProperty 'java.awt.headless', 'true'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.tunuino.ui.LogoHelperSmokeTest'
}

tasks.register('localizedMessagesTest', JavaExec) {
    group = 'verification'
    systemProperty 'java.awt.headless', 'true'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.tunuino.ui.util.LocalizedMessagesSmokeTest'
}

tasks.register('uiUtilsTest', JavaExec) {
    group = 'verification'
    systemProperty 'java.awt.headless', 'true'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.tunuino.ui.util.UiUtilsSmokeTest'
}

tasks.named('check') {
    dependsOn tasks.named('smokeTest'), tasks.named('localizedMessagesTest'), tasks.named('uiUtilsTest')
}
