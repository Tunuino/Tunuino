plugins {
    id 'java-library'
}

dependencies {
    api project(':branding')
}

tasks.register('smokeTest', JavaExec) {
    group = 'verification'
    systemProperty 'java.awt.headless', 'true'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.tunuino.ui.LogoHelperSmokeTest'
}

tasks.register('localizedMessagesTest', JavaExec) {
    group = 'verification'
    systemProperty 'java.awt.headless', 'true'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.tunuino.ui.util.LocalizedMessagesSmokeTest'
}

tasks.register('uiUtilsTest', JavaExec) {
    group = 'verification'
    systemProperty 'java.awt.headless', 'true'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.tunuino.ui.util.UiUtilsSmokeTest'
}

tasks.register('statusPanelTest', JavaExec) {
    group = 'verification'
    systemProperty 'java.awt.headless', 'true'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.tunuino.ui.ConsoleStatusPanelSmokeTest'
}

tasks.register('preview', JavaExec) {
    group = 'application'
    description = 'Launch the Tunuino desktop status viewer'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.tunuino.ui.ConsoleStatusApp'
}

tasks.register('statusAppTest', JavaExec) {
    group = 'verification'
    systemProperty 'java.awt.headless', 'true'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.tunuino.ui.ConsoleStatusAppSmokeTest'
}

tasks.register('telemetryFrameTest', JavaExec) {
    group = 'verification'
    systemProperty 'java.awt.headless', 'true'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.tunuino.ui.protocol.TelemetryFrameSmokeTest'
}

tasks.register('telemetryPresenterTest', JavaExec) {
    group = 'verification'
    systemProperty 'java.awt.headless', 'true'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.tunuino.ui.protocol.TelemetryPresenterSmokeTest'
}

tasks.named('check') {
    dependsOn tasks.named('smokeTest'), tasks.named('localizedMessagesTest'), tasks.named('uiUtilsTest'), tasks.named('statusPanelTest'), tasks.named('statusAppTest'), tasks.named('telemetryFrameTest'), tasks.named('telemetryPresenterTest')
}
