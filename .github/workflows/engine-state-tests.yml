name: Tunuino integrated engine state tests
on:
  push:
  pull_request:
jobs:
  engine-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile integrated engine state
        run: cc -std=c11 -Wall -Wextra -Werror -pedantic firmware/core/trigger_60_2.c firmware/core/engine_phase.c firmware/core/engine_position.c firmware/core/engine_speed.c firmware/core/engine_state.c tests/test_engine_state.c -o /tmp/tunuino_engine_state
      - name: Run integrated engine state
        run: /tmp/tunuino_engine_state
