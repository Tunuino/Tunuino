name: Tunuino Console UART pump tests
on:
  push:
  pull_request:
jobs:
  uart-pump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile UART pump tests
        run: cc -std=c11 -Wall -Wextra -Werror -pedantic firmware/core/console_tx_queue.c firmware/core/console_uart_pump.c tests/test_console_uart_pump.c -o /tmp/tunuino_uart_pump
      - name: Run UART pump tests
        run: /tmp/tunuino_uart_pump
