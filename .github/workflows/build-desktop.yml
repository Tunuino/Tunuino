name: Desktop tools and simulator
'on':
  push:
    branches: [master]
    paths:
    - .github/workflows/build-desktop.yml
    - java_console/**
    - java_tools/**
    - simulator/**
    - gradle/**
    - build.gradle
    - settings.gradle
    - gradle.properties
    - gradlew
    - tools/**
    - misc/**
  pull_request:
    branches: [master]
    paths:
    - .github/workflows/build-desktop.yml
    - java_console/**
    - java_tools/**
    - simulator/**
    - gradle/**
    - build.gradle
    - settings.gradle
    - gradle.properties
    - gradlew
    - tools/**
    - misc/**
  workflow_call: {}
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: '21'
    - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
    - name: Build Java modules, tool distributions and test the actual simulator
      run: xvfb-run -a ./gradlew --no-daemon --console=plain :java_console:assemble :java_console:verifyInterface :java_tools:installDist :java_tools:check
    - name: Verify deterministic definitions and simulator wire behavior
      run: |-
        python3 misc/actions/verify_generated.py
        python3 tools/check_simulator.py
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: desktop-tools-and-simulator-${{ github.sha }}
        path: |-
          java_tools/build/install/java_tools/
          build/simulator/
          java_console/build/interface-check/
        if-no-files-found: error
        retention-days: 30
