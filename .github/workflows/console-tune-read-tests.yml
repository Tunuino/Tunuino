name: Tunuino Console tune read tests
on:
  push:
  pull_request:
jobs:
  tune-read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile read-only tune protocol tests
        run: cc -std=c11 -Wall -Wextra -Werror -pedantic firmware/core/tune_maps.c firmware/core/tune_validation.c firmware/core/tune_store.c firmware/core/tune_wire.c firmware/core/console_protocol.c firmware/core/console_tune_read.c tests/test_console_tune_read.c -o /tmp/tunuino_console_tune_read
      - name: Run tune read tests
        run: /tmp/tunuino_console_tune_read
