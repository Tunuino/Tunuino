name: Tunuino firmware stack usage
on:
  push:
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware-stack-usage.yml'
  pull_request:
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware-stack-usage.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stack-usage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure ARM toolchain
        run: |
          if command -v arm-none-eabi-gcc >/dev/null 2>&1 && command -v arm-none-eabi-objcopy >/dev/null 2>&1; then
            arm-none-eabi-gcc --version | head -n 1
          else
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends gcc-arm-none-eabi binutils-arm-none-eabi
          fi
      - name: Compile with stack usage reports
        run: make -C firmware/platform/stm32f429 CFLAGS='-mcpu=cortex-m4 -mthumb -DSTM32F429xx -std=c11 -Os -ffreestanding -fdata-sections -ffunction-sections -Wall -Wextra -Werror -fstack-usage'
      - name: Collect stack reports
        run: |
          mkdir -p stack-reports
          find firmware/platform/stm32f429/build -name '*.su' -exec cp --parents '{}' stack-reports/ \;
          test -n "$(find stack-reports -name '*.su' -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: tunuino-stack-usage
          path: stack-reports/
