name: Tunuino board host tests
on:
  push:
  pull_request:
jobs:
  board-host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build board safety test
        run: cc -std=c11 -Wall -Wextra -Werror -pedantic firmware/platform/stm32f407/board.c tests/test_board.c -o /tmp/tunuino_board_test
      - name: Run board safety test
        run: /tmp/tunuino_board_test
