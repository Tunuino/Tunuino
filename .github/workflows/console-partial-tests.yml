name: Tunuino Console partial telemetry tests
on:
  push:
  pull_request:
jobs:
  partial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile C partial telemetry tests
        run: cc -std=c11 -Wall -Wextra -Werror -pedantic firmware/core/console_protocol.c firmware/core/console_partial.c tests/test_console_partial.c -o /tmp/tunuino_partial
      - name: Run C tests
        run: /tmp/tunuino_partial
      - name: Run JS tests
        working-directory: console
        run: npm test
