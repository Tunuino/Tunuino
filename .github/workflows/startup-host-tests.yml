name: Tunuino startup host tests
on:
  push:
  pull_request:
jobs:
  startup-host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build startup contract test
        run: cc -std=c11 -Wall -Wextra -Werror -pedantic firmware/platform/stm32f407/startup_contract.c tests/test_startup_contract.c -o /tmp/tunuino_startup_test
      - name: Run startup contract test
        run: /tmp/tunuino_startup_test
