name: Tunuino tune wire tests
on:
  push:
  pull_request:
jobs:
  tune-wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile tune wire tests
        run: cc -std=c11 -Wall -Wextra -Werror -pedantic firmware/core/tune_maps.c firmware/core/tune_validation.c firmware/core/tune_store.c firmware/core/tune_wire.c tests/test_tune_wire.c -o /tmp/tunuino_tune_wire
      - name: Run wire tests
        run: /tmp/tunuino_tune_wire
