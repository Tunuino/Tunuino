name: Tunuino CI
run-name: "Tunuino CI \xB7 ${{ github.event_name }} \xB7 ${{ github.ref_name }}"
'on':
  push:
    branches:
    - master
    paths:
    - .github/**
    - firmware/**
    - console/**
    - tools/**
    - hardware/**
    - samples/**
    - LICENSE
  pull_request:
    branches:
    - master
    paths:
    - .github/**
    - firmware/**
    - console/**
    - tools/**
    - hardware/**
    - samples/**
    - LICENSE
  workflow_dispatch: null
  schedule:
  - cron: '20 2 * * *'
permissions:
  contents: read
concurrency:
  group: tunuino-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    name: Select affected components
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      core: ${{ steps.scope.outputs.core }}
      arm: ${{ steps.scope.outputs.arm }}
      bench: ${{ steps.scope.outputs.bench }}
      console: ${{ steps.scope.outputs.console }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        fetch-depth: 0
    - id: scope
      run: python3 tools/ci_scope.py
  checks:
    name: Core checks (${{ matrix.compiler }})
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        compiler:
        - gcc
        - clang
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: '21'
    - name: C, Java, KiCad and simulated USB tests
      env:
        CC: ${{ matrix.compiler }}
      run: python3 tools/check_core.py
  arm:
    name: ARM libraries and Proteus USB image
    needs:
    - changes
    - checks
    if: needs.changes.outputs.arm == 'true' || needs.changes.outputs.bench == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: .toolchains/arm
        key: ${{ runner.os }}-${{ runner.arch }}-arm-xpack-13.2.1-1.1-${{ hashFiles('tools/setup_arm_toolchain.sh')
          }}
    - name: Restore or download verified ARM toolchain
      timeout-minutes: 6
      run: bash tools/setup_arm_toolchain.sh
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      if: needs.changes.outputs.bench == 'true'
      with:
        repository: Tunuino/ChibiOS
        ref: fd2e59c34878b1ef93ef5358f11fb5cc830027ff
        path: .deps/chibios
        persist-credentials: false
    - name: Cross-compile M4 and M7 with the same toolchain
      if: needs.changes.outputs.arm == 'true'
      run: |-
        python3 tools/build_arm_core.py --cpu cortex-m4 --output build/arm/cortex-m4
        python3 tools/build_arm_core.py --cpu cortex-m7 --output build/arm/cortex-m7
        cp LICENSE build/arm/LICENSE.txt
    - name: Build and inspect Proteus F427 USB image
      if: needs.changes.outputs.bench == 'true'
      run: python3 tools/build_proteus_usb_bench.py --output build/proteus-v07-usb-bench
    - name: Preserve arm-core-NOT-FLASHABLE-${{ github.sha }}
      if: needs.changes.outputs.arm == 'true'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: arm-core-NOT-FLASHABLE-${{ github.sha }}
        path: |-
          build/arm/*/*.a
          build/arm/*/*.json
          build/arm/*/*.txt
          build/arm/LICENSE.txt
        if-no-files-found: error
        retention-days: 30
    - name: Preserve firmware-proteus-f427-${{ github.sha }}
      if: needs.changes.outputs.bench == 'true'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: firmware-proteus-f427-${{ github.sha }}
        path: |-
          build/proteus-v07-usb-bench/*.elf
          build/proteus-v07-usb-bench/*.bin
          build/proteus-v07-usb-bench/*.hex
          build/proteus-v07-usb-bench/*.json
          build/proteus-v07-usb-bench/*.properties
          build/proteus-v07-usb-bench/*.ini
          build/proteus-v07-usb-bench/*.map
          build/proteus-v07-usb-bench/*.txt
          build/proteus-v07-usb-bench/*.tar.gz
          build/proteus-v07-usb-bench/third-party-licenses/
        if-no-files-found: error
        retention-days: 30
  console:
    name: Windows Console and packaged runtime check
    needs:
    - changes
    - checks
    if: needs.changes.outputs.console == 'true'
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: 'false'
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: '21'
        cache: maven
        cache-dependency-path: console/pom.xml
    - name: Compile and collect runtime dependencies
      run: mvn --batch-mode --no-transfer-progress --file console/pom.xml verify org.apache.maven.plugins:maven-dependency-plugin:3.8.1:copy-dependencies
        -DincludeScope=runtime -DoutputDirectory=target/app/lib "-Dtunuino.sourceCommit=${{ github.sha }}"
    - name: Firmware validation and programmer failure checks on Windows
      run: python tools/check_maintenance.py
    - name: Test the actual release JAR with simulated programmer output
      run: python tools/check_maintenance.py --jar console/target/tunuino-console-0.1.0-SNAPSHOT.jar
    - name: Build portable Windows application with Java runtime
      shell: pwsh
      run: |
        Copy-Item console/target/tunuino-console-0.1.0-SNAPSHOT.jar console/target/app/tunuino-console.jar
        Copy-Item LICENSE console/target/app/LICENSE.txt
        jpackage --type app-image --name TunuinoConsole --app-version 0.1.0 --vendor Tunuino --input console/target/app --main-jar tunuino-console.jar --main-class io.tunuino.console.Launcher --add-modules java.base,java.desktop,java.logging,java.naming,java.xml,java.management,jdk.unsupported,jdk.crypto.ec --dest build/windows
        if ($LASTEXITCODE -ne 0) { throw 'jpackage failed' }
    - name: Verify packaged JavaFX and USB serial runtime
      shell: pwsh
      run: |
        $exe = (Resolve-Path build/windows/TunuinoConsole/TunuinoConsole.exe).Path
        $process = Start-Process -FilePath $exe -ArgumentList '--verify-runtime' -PassThru -RedirectStandardOutput runtime-check.txt -RedirectStandardError runtime-check-errors.txt
        if (-not $process.WaitForExit(60000)) {
          $process.Kill()
          throw 'Packaged runtime check timed out'
        }
        $process.Refresh()
        Get-Content runtime-check.txt
        Get-Content runtime-check-errors.txt
        if ($process.ExitCode -ne 0) { throw "Packaged runtime check failed: $($process.ExitCode)" }
    - name: Prepare offline programmer tool layout
      shell: pwsh
      run: python tools/package_programmer_tools.py --destination build/windows/TunuinoConsole
    - name: Record component provenance
      shell: pwsh
      run: |-
        $jar = 'build/windows/TunuinoConsole/app/tunuino-console.jar'
        $metadata = @{
         source_commit = $env:GITHUB_SHA
         run_id = $env:GITHUB_RUN_ID
         main_jar_sha256 = (Get-FileHash $jar -Algorithm SHA256).Hash.ToLowerInvariant()
         runtime_verified = $true
         physical_ecu_validation = $false
        }
        $metadata | ConvertTo-Json | Set-Content -Encoding utf8 build/windows/TunuinoConsole/package-manifest.json
    - name: Preserve portable Windows Console
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: console-windows-x64-${{ github.sha }}
        path: build/windows/TunuinoConsole/
        if-no-files-found: error
        retention-days: '30'
  result:
    name: CI result and synchronized bench kit
    needs:
    - changes
    - checks
    - arm
    - console
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - name: Report all component results
      env:
        RESULTS: ${{ toJSON(needs) }}
      run: |-
        python3 - <<'PY'
        import json, os
        results = json.loads(os.environ["RESULTS"])
        with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
            out.write("## Tunuino CI\n\n| Component | Result |\n|---|---|\n")
            for name, data in results.items():
                out.write(f"| {name} | {data['result']} |\n")
            out.write("\nSkipped components had no relevant source changes. Manual runs build the full kit.\n")
        if any(data["result"] in ("failure", "cancelled") for data in results.values()):
            raise SystemExit("CI failed or was cancelled; no synchronized kit will be published")
        PY
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      if: needs.changes.outputs.bench == 'true' && needs.changes.outputs.console == 'true'
      with:
        name: firmware-proteus-f427-${{ github.sha }}
        path: build/kit/firmware
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      if: needs.changes.outputs.bench == 'true' && needs.changes.outputs.console == 'true'
      with:
        name: console-windows-x64-${{ github.sha }}
        path: build/kit/console
    - name: Verify common source commit and package checksums
      if: needs.changes.outputs.bench == 'true' && needs.changes.outputs.console == 'true'
      run: python3 tools/ci_package_kit.py
    - name: Preserve Tunuino-Proteus-v07-USB-Bench-Kit-${{ github.sha }}
      if: needs.changes.outputs.bench == 'true' && needs.changes.outputs.console == 'true'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: Tunuino-Proteus-v07-USB-Bench-Kit-${{ github.sha }}
        path: build/kit/
        if-no-files-found: error
        retention-days: 30

  release:
    name: Publish experimental GitHub Release
    needs:
    - changes
    - checks
    - arm
    - console
    - result
    if: >-
      github.repository == 'Tunuino/Tunuino' && github.ref == 'refs/heads/master' &&
      github.event_name != 'pull_request' &&
      needs.checks.result == 'success' && needs.arm.result == 'success' &&
      needs.console.result == 'success' && needs.result.result == 'success' &&
      needs.changes.outputs.bench == 'true' && needs.changes.outputs.console == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: Tunuino-Proteus-v07-USB-Bench-Kit-${{ github.sha }}
        path: build/kit
    - name: Validate synchronized kit again
      run: python3 tools/ci_package_kit.py
    - name: Prepare single bundle with internal checksums
      run: python3 tools/ci_release.py
    - name: Upload assets to draft and publish release
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      shell: bash
      run: |
        set -euo pipefail
        tag="nightly-$(date -u +%F)-${GITHUB_RUN_ID}"
        title="Tunuino Nightly $(date -u +%F) · build ${GITHUB_RUN_NUMBER} · USB Bench"
        if gh release view "$tag" --json isDraft,targetCommitish > build/existing-release.json; then
          python3 -c 'import json,os; r=json.load(open("build/existing-release.json")); assert r["targetCommitish"] == os.environ["GITHUB_SHA"], "Release points to another commit"'
          if python3 -c 'import json,sys; sys.exit(0 if not json.load(open("build/existing-release.json"))["isDraft"] else 1)'; then
            echo "Release already published for this run; keeping its assets."
            exit 0
          fi
        else
          gh release create "$tag" --target "$GITHUB_SHA" --title "$title" --notes-file build/release-notes.md --draft --prerelease
        fi
        gh release upload "$tag" build/release/* --clobber
        gh release edit "$tag" --draft=false --prerelease --latest=false
        gh release view "$tag" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
    - name: Keep only bundle attachments in previous nightly Releases
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: python3 tools/ci_cleanup_releases.py
