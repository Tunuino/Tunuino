name: Tunuino Bundle
run-name: Tunuino Bundle · ${{ github.event_name }} · ${{ github.event.workflow_run.head_sha || github.sha }}
'on':
  workflow_run:
    workflows: [Windows Console]
    types: [completed]
    branches: [master]
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: tunuino-bundle-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false
jobs:
  bundle:
    name: Assemble validated component artifacts
    if: github.repository == 'Tunuino/Tunuino' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == 'Tunuino/Tunuino'))
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.event.workflow_run.head_sha || github.sha }}
        persist-credentials: false
    - name: Collect matching successful component runs and artifacts
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      run: python3 tools/ci_collect_components.py
    - name: Verify common commit and package checksums
      env:
        GITHUB_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      run: python3 tools/ci_package_kit.py
    - name: Preserve validated Bundle
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: Tunuino-Proteus-v07-USB-Bench-Kit-${{ github.event.workflow_run.head_sha || github.sha }}
        path: build/kit/
        if-no-files-found: error
        retention-days: 30
