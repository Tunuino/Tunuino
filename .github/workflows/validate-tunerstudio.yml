name: TunerStudio
'on':
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_call: {}
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  validate:
    name: Validate TunerStudio definition
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - name: Check generated INI and signature header
      run: python3 misc/actions/verify_generated.py
    - name: Check INI against actual C wire responses
      run: python3 tools/check_tunerstudio.py
