name: Tunuino CKP CMP phase tests
on:
  push:
  pull_request:
jobs:
  engine-phase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile phase tests
        run: cc -std=c11 -Wall -Wextra -Werror -pedantic firmware/core/engine_phase.c tests/test_engine_phase.c -o /tmp/tunuino_engine_phase
      - name: Run phase tests
        run: /tmp/tunuino_engine_phase
