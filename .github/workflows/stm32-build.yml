name: Tunuino STM32 firmware build
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure ARM toolchain
        run: |
          if command -v arm-none-eabi-gcc >/dev/null 2>&1 && command -v arm-none-eabi-objcopy >/dev/null 2>&1; then
            arm-none-eabi-gcc --version | head -n 1
          else
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends gcc-arm-none-eabi binutils-arm-none-eabi
          fi
      - name: Build ELF and BIN
        run: make -C firmware/platform/stm32f429
      - name: Preserve standalone build
        run: |
          mkdir -p firmware-artifacts
          cp firmware/platform/stm32f429/build/tunuino.bin firmware-artifacts/tunuino-standalone.bin
          cp firmware/platform/stm32f429/build/tunuino.elf firmware-artifacts/tunuino-standalone.elf
      - name: Validate alternate application origin (bootloader layout smoke test)
        run: |
          make -C firmware/platform/stm32f429 clean
          make -C firmware/platform/stm32f429 APP_FLASH_ORIGIN=0x08008000
          arm-none-eabi-objdump -h firmware/platform/stm32f429/build/tunuino.elf | grep -E 'isr_vector.*08008000'
          cp firmware/platform/stm32f429/build/tunuino.bin firmware-artifacts/tunuino-offset-test.bin
      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tunuino-stm32f429-builds
          path: firmware-artifacts/
