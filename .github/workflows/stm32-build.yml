name: Tunuino STM32 firmware build
on:
  push:
  pull_request:
jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM GCC
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi
      - name: Build ELF and BIN
        run: make -C firmware/platform/stm32f407
      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tunuino-stm32f429-first-boot
          path: |
            firmware/platform/stm32f407/build/tunuino.elf
            firmware/platform/stm32f407/build/tunuino.bin
            firmware/platform/stm32f407/build/tunuino.map
