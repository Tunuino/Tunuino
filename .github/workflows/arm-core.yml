name: ARM core compilation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arm-core:
    name: Portable core on ${{ matrix.cpu }} (not flashable)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        cpu: [cortex-m4, cortex-m7]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install ARM bare-metal compiler and C headers
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gcc-arm-none-eabi libnewlib-arm-none-eabi
      - name: Cross-compile core and inspect atomic helper dependencies
        run: python3 tools/build_arm_core.py --cpu ${{ matrix.cpu }} --output build/arm/${{ matrix.cpu }}
      - name: Preserve library and provenance (not an ECU image)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tunuino-core-${{ matrix.cpu }}-NOT-FLASHABLE
          path: build/arm/${{ matrix.cpu }}/
          if-no-files-found: error
          retention-days: 14
