name: Tunuino host tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Check declared Git submodules
        run: python3 scripts/check_submodules.py
      - name: Verify third-party license inventory
        run: python3 scripts/check_third_party_inventory.py
      - name: Report reference architecture coverage
        run: python3 scripts/report_architecture_coverage.py

  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Upload CTest logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tunuino-host-ctest-logs
          path: build/Testing/Temporary/
          if-no-files-found: ignore
