name: Tunuino repository integrity

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Check declared Git submodules
        run: python3 scripts/check_submodules.py
      - name: Verify third-party license inventory
        run: python3 scripts/check_third_party_inventory.py
      - name: Report reference architecture coverage
        run: python3 scripts/report_architecture_coverage.py
