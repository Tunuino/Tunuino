name: Tunuino host tests
on:
  push:
  pull_request:
jobs:
  repository-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check declared Git submodules
        run: python3 scripts/check_submodules.py
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
  simulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test native simulator target
        run: make -C simulator test
  java-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate Gradle wrapper
        run: ./gradlew --version
      - name: Reject legacy Java namespaces
        run: |
          if grep -RInE 'com[.]ru[a-z]+|org[.]ru[a-z]+' java_console java_tools --include='*.java' --include='*.gradle'; then
            echo 'Legacy Java namespace found'
            exit 1
          fi
      - name: Build Tunuino Java tools
        run: ./gradlew build --no-daemon
