name: Tunuino Console tune link tests
on:
  push:
  pull_request:
jobs:
  tune-link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile end-to-end simulated transport
        run: cc -std=c11 -Wall -Wextra -Werror -pedantic firmware/core/tune_maps.c firmware/core/tune_validation.c firmware/core/tune_store.c firmware/core/tune_wire.c firmware/core/console_protocol.c firmware/core/console_tune_read.c firmware/core/console_tx_queue.c firmware/core/console_tune_request.c firmware/core/console_tune_rx.c firmware/core/console_uart_pump.c firmware/core/console_tune_link.c tests/test_console_tune_link.c -o /tmp/tunuino_console_tune_link
      - name: Run end-to-end simulated transport
        run: /tmp/tunuino_console_tune_link
