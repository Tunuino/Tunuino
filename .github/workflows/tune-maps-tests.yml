name: Tunuino tune map tests
on:
  push:
  pull_request:
jobs:
  map-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile fixed-point map tests
        run: cc -std=c11 -Wall -Wextra -Werror -pedantic firmware/core/tune_maps.c tests/test_tune_maps.c -o /tmp/tunuino_tune_maps
      - name: Run map tests
        run: /tmp/tunuino_tune_maps
