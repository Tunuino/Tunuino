name: Tunuino firmware package
on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Arm GNU Toolchain (arm-none-eabi-gcc)
        uses: carlosperate/arm-none-eabi-gcc-action@v1.14.0
        with:
          release: '14.2.Rel1'
      - name: Validate version tag before packaging
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $TAG (expected vMAJOR.MINOR.PATCH)" >&2
            exit 1
          fi
      - name: Build standalone STM32F429 firmware
        run: make -C firmware BOARD=stm32f429
      - name: Verify vector table and export package
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct
          image = Path('firmware/platform/stm32f429/build/tunuino.bin').read_bytes()
          assert len(image) >= 8
          sp, reset = struct.unpack_from('<II', image)
          assert 0x20000000 < sp <= 0x20020000 and sp % 4 == 0
          assert reset & 1 and 0x08000000 <= (reset & ~1) < 0x08000000 + len(image)
          print(f'Standalone firmware: {len(image)} bytes, SP={sp:#x}, reset={reset:#x}')
          PY
          mkdir -p package
          cp firmware/platform/stm32f429/build/tunuino.bin package/tunuino-stm32f429-standalone.bin
          (cd package && sha256sum tunuino-stm32f429-standalone.bin > SHA256SUMS && sha256sum --check SHA256SUMS)
      - name: Check packaged firmware and metadata
        run: |
          test -s package/tunuino-stm32f429-standalone.bin
          test -s package/SHA256SUMS
          (cd package && sha256sum --check SHA256SUMS)
      - name: Publish build artifact
        uses: actions/upload-artifact@v4
        with:
          name: tunuino-stm32f429-standalone-unverified
          path: package/
  release:
    name: Publish experimental GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tunuino-stm32f429-standalone-unverified
          path: package
      - name: Verify packaged checksums
        run: cd package && sha256sum --check SHA256SUMS
      - name: Publish pre-release with checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" package/tunuino-stm32f429-standalone.bin package/SHA256SUMS \
            --repo "$REPO" --verify-tag --prerelease \
            --title "Tunuino $TAG (experimental)" \
            --notes "Experimental STM32F429 standalone firmware. Cross-compiled and vector-table checked in CI; not validated on physical hardware. Do not connect to an engine, injectors or ignition coils."
