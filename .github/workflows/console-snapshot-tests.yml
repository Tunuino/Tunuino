name: Tunuino Console sensor snapshot tests
on:
  push:
  pull_request:
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile sensor snapshot tests
        run: cc -std=c11 -Wall -Wextra -Werror -pedantic firmware/core/console_snapshot.c tests/test_console_snapshot.c -o /tmp/tunuino_console_snapshot
      - name: Run sensor snapshot tests
        run: /tmp/tunuino_console_snapshot
