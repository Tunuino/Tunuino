name: Tunuino Console service tests
on:
  push:
  pull_request:
jobs:
  service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Console service tests
        run: cc -std=c11 -Wall -Wextra -Werror -pedantic firmware/core/console_protocol.c firmware/core/console_tx.c firmware/core/console_tx_queue.c firmware/core/console_uart_pump.c firmware/core/console_service.c tests/test_console_service.c -o /tmp/tunuino_console_service
      - name: Run Console service tests
        run: /tmp/tunuino_console_service
