name: Qt Console Windows
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      firmware_run_id:
        description: 'Successful Tunuino_Firmware F427 workflow run ID (optional; required for firmware bundle)'
        required: false
        type: string
jobs:
  windows-build:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Set up supported Python for Qt installer
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          arch: win64_msvc2019_64
          modules: qtserialport
          cache: true
      - name: Configure
        run: cmake -S qt_console -B qt_console/build -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build qt_console/build --config Release --parallel 2
      - name: Unit tests
        run: ctest --test-dir qt_console/build -C Release --output-on-failure
      - name: Smoke test Windows launch (offscreen)
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $exe = (Resolve-Path "qt_console/build/Release/TunuinoConsole.exe").Path
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 4
          if ($process.HasExited) { throw "Console exited during startup with code $($process.ExitCode)" }
          Stop-Process -Id $process.Id -Force
      - name: Package Qt runtime
        run: |
          New-Item -ItemType Directory -Force -Path qt_console/dist | Out-Null
          Copy-Item qt_console/build/Release/TunuinoConsole.exe qt_console/dist/
          Copy-Item qt_console/build/Release/EcuIdentityProbe.exe qt_console/dist/
          windeployqt --release --no-translations --dir qt_console/dist qt_console/dist/TunuinoConsole.exe
          windeployqt --release --no-translations --dir qt_console/dist qt_console/dist/EcuIdentityProbe.exe
      - name: Build branded Windows setup (Inno Setup)
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\\ISCC.exe'
          if (!(Test-Path $iscc)) { throw 'Inno Setup 6 is not installed on runner' }
          & $iscc "/DAppSource=$((Resolve-Path 'qt_console/dist').Path)" '/DAppVersion=0.1.0' 'installer/TunuinoConsole.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed' }
          if (!(Test-Path 'installer/output/Tunuino-Console-Setup-0.1.0.exe')) { throw 'Installer not produced' }
      - name: Verify installer payload and record SHA-256
        run: |
          $setup = 'installer/output/Tunuino-Console-Setup-0.1.0.exe'
          if (!(Test-Path $setup)) { throw 'Installer missing' }
          if ((Get-Item $setup).Length -lt 1000000) { throw 'Installer unexpectedly small' }
          $digest = (Get-FileHash -Algorithm SHA256 $setup).Hash.ToLowerInvariant()
          "$digest  Tunuino-Console-Setup-0.1.0.exe" | Set-Content -Encoding ascii 'installer/output/SHA256SUMS.txt'
          Write-Host "Installer SHA-256: $digest"
      - name: Download explicitly selected F427 firmware artifact
        if: ${{ inputs.firmware_run_id != '' }}
        env:
          GH_TOKEN: ${{ secrets.FIRMWARE_READ_TOKEN || github.token }}
          FIRMWARE_RUN_ID: ${{ inputs.firmware_run_id }}
        run: |
          if ($env:FIRMWARE_RUN_ID -notmatch '^[0-9]+$') { throw 'firmware_run_id must be numeric' }
          $run = gh api "repos/Tunuino/Tunuino_Firmware/actions/runs/$env:FIRMWARE_RUN_ID" | ConvertFrom-Json
          if ($run.conclusion -ne 'success' -or $run.head_branch -ne 'master') { throw 'Firmware run must have succeeded on master' }
          $items = (gh api "repos/Tunuino/Tunuino_Firmware/actions/runs/$env:FIRMWARE_RUN_ID/artifacts" | ConvertFrom-Json).artifacts
          $matching = @($items | Where-Object { $_.name -eq "f427-build-unverified-$($run.head_sha)" -and -not $_.expired })
          if ($matching.Count -ne 1) { throw 'Exactly one unexpired F427 artifact matching the firmware commit is required' }
          New-Item -ItemType Directory -Force -Path 'qt_console/firmware' | Out-Null
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json"; "X-GitHub-Api-Version" = "2022-11-28" }
          Invoke-WebRequest -Uri "https://api.github.com/repos/Tunuino/Tunuino_Firmware/actions/artifacts/$($matching[0].id)/zip" -Headers $headers -OutFile "$env:RUNNER_TEMP/firmware.zip"
          Expand-Archive -LiteralPath "$env:RUNNER_TEMP/firmware.zip" -DestinationPath 'qt_console/firmware' -Force
          $bins = @(Get-ChildItem 'qt_console/firmware' -Recurse -Filter '*.bin')
          if ($bins.Count -ne 1 -or $bins[0].Length -lt 8) { throw 'Expected exactly one nonempty F427 binary' }
          "Firmware source: Tunuino/Tunuino_Firmware commit $($run.head_sha), run $env:FIRMWARE_RUN_ID; NOT hardware validated" | Set-Content 'qt_console/firmware/FIRMWARE-SOURCE.txt'
      - name: Create test bundle with Qt Console and F427 firmware
        if: ${{ inputs.firmware_run_id != '' }}
        run: |
          New-Item -ItemType Directory -Force -Path 'qt_console/bundle' | Out-Null
          Copy-Item 'qt_console/dist' 'qt_console/bundle/Console' -Recurse
          Copy-Item 'qt_console/firmware' 'qt_console/bundle/Firmware' -Recurse
          Compress-Archive -Path 'qt_console/bundle/*' -DestinationPath 'Tunuino-F427-Bundle.zip' -Force
      - name: Upload test bundle
        if: ${{ inputs.firmware_run_id != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Tunuino-F427-Bundle
          path: Tunuino-F427-Bundle.zip
          if-no-files-found: error
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: TunuinoConsole-Setup-Windows-x64
          path: |
            installer/output/Tunuino-Console-Setup-0.1.0.exe
            installer/output/SHA256SUMS.txt
          if-no-files-found: error
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: TunuinoConsole-Windows-x64
          path: qt_console/dist/
          if-no-files-found: error
