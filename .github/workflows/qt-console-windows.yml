name: Qt Console Windows
on:
  push:
    branches: [master]
  workflow_dispatch:
jobs:
  windows-build:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Set up supported Python for Qt installer
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          arch: win64_msvc2019_64
          modules: qtserialport
          cache: true
      - name: Configure
        run: cmake -S qt_console -B qt_console/build -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build qt_console/build --config Release --parallel 2
      - name: Unit tests
        run: ctest --test-dir qt_console/build -C Release --output-on-failure
      - name: Smoke test Windows launch (offscreen)
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $exe = (Resolve-Path "qt_console/build/Release/TunuinoConsole.exe").Path
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 4
          if ($process.HasExited) { throw "Console exited during startup with code $($process.ExitCode)" }
          Stop-Process -Id $process.Id -Force
      - name: Package Qt runtime
        run: |
          New-Item -ItemType Directory -Force -Path qt_console/dist | Out-Null
          Copy-Item qt_console/build/Release/TunuinoConsole.exe qt_console/dist/
          Copy-Item qt_console/build/Release/EcuIdentityProbe.exe qt_console/dist/
          windeployqt --release --no-translations --dir qt_console/dist qt_console/dist/TunuinoConsole.exe
          windeployqt --release --no-translations --dir qt_console/dist qt_console/dist/EcuIdentityProbe.exe
      - name: Build branded Windows setup (Inno Setup)
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\\ISCC.exe'
          if (!(Test-Path $iscc)) { throw 'Inno Setup 6 is not installed on runner' }
          & $iscc "/DAppSource=$((Resolve-Path 'qt_console/dist').Path)" '/DAppVersion=0.1.0' 'installer/TunuinoConsole.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed' }
          if (!(Test-Path 'installer/output/Tunuino-Console-Setup-0.1.0.exe')) { throw 'Installer not produced' }
      - name: Verify installer payload and record SHA-256
        run: |
          $setup = 'installer/output/Tunuino-Console-Setup-0.1.0.exe'
          if (!(Test-Path $setup)) { throw 'Installer missing' }
          if ((Get-Item $setup).Length -lt 1000000) { throw 'Installer unexpectedly small' }
          $digest = (Get-FileHash -Algorithm SHA256 $setup).Hash.ToLowerInvariant()
          "$digest  Tunuino-Console-Setup-0.1.0.exe" | Set-Content -Encoding ascii 'installer/output/SHA256SUMS.txt'
          Write-Host "Installer SHA-256: $digest"
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: TunuinoConsole-Setup-Windows-x64
          path: |
            installer/output/Tunuino-Console-Setup-0.1.0.exe
            installer/output/SHA256SUMS.txt
          if-no-files-found: error
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: TunuinoConsole-Windows-x64
          path: qt_console/dist/
          if-no-files-found: error
