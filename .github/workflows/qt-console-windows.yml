name: Qt Console Windows
on:
  push:
    branches: [master]
    paths:
      - 'qt_console/**'
      - '.github/workflows/qt-console-windows.yml'
      - 'installer/TunuinoConsole.iss'
      - 'LICENSE'
      - '.github/workflows/build-firmware.yml'
  workflow_dispatch:
jobs:
  windows-build:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Set up supported Python for Qt installer
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          arch: win64_msvc2019_64
          modules: qtserialport
          cache: true
      - name: Configure
        run: cmake -S qt_console -B qt_console/build -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build qt_console/build --config Release --parallel 2
      - name: Unit tests
        run: ctest --test-dir qt_console/build -C Release --output-on-failure
      - name: Smoke test Windows launch (offscreen)
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $exe = (Resolve-Path "qt_console/build/Release/TunuinoConsole.exe").Path
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 4
          if ($process.HasExited) { throw "Console exited during startup with code $($process.ExitCode)" }
          Stop-Process -Id $process.Id -Force
      - name: Package Qt runtime
        run: |
          New-Item -ItemType Directory -Force -Path qt_console/dist | Out-Null
          Copy-Item qt_console/build/Release/TunuinoConsole.exe qt_console/dist/
          Copy-Item qt_console/build/Release/EcuIdentityProbe.exe qt_console/dist/
          windeployqt --release --no-translations --dir qt_console/dist qt_console/dist/TunuinoConsole.exe
          windeployqt --release --no-translations --dir qt_console/dist qt_console/dist/EcuIdentityProbe.exe
      - name: Build branded Windows setup (Inno Setup)
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\\ISCC.exe'
          if (!(Test-Path $iscc)) { throw 'Inno Setup 6 is not installed on runner' }
          & $iscc "/DAppSource=$((Resolve-Path 'qt_console/dist').Path)" '/DAppVersion=0.1.0' 'installer/TunuinoConsole.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed' }
          if (!(Test-Path 'installer/output/Tunuino-Console-Setup-0.1.0.exe')) { throw 'Installer not produced' }
      - name: Verify installer payload and record SHA-256
        run: |
          $setup = 'installer/output/Tunuino-Console-Setup-0.1.0.exe'
          if (!(Test-Path $setup)) { throw 'Installer missing' }
          if ((Get-Item $setup).Length -lt 1000000) { throw 'Installer unexpectedly small' }
          $digest = (Get-FileHash -Algorithm SHA256 $setup).Hash.ToLowerInvariant()
          "$digest  Tunuino-Console-Setup-0.1.0.exe" | Set-Content -Encoding ascii 'installer/output/SHA256SUMS.txt'
          Write-Host "Installer SHA-256: $digest"
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: TunuinoConsole-Setup-Windows-x64
          path: |
            installer/output/Tunuino-Console-Setup-0.1.0.exe
            installer/output/SHA256SUMS.txt
          if-no-files-found: error
      - name: Assemble Qt console and firmware bench Bundle
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $sha = '${{ github.sha }}'
          $repo = '${{ github.repository }}'
          $runs = gh api "repos/$repo/actions/workflows/build-firmware.yml/runs?head_sha=$sha&event=push&per_page=30" | ConvertFrom-Json
          $run = $runs.workflow_runs | Where-Object { $_.head_sha -eq $sha -and $_.head_branch -eq 'master' -and $_.status -eq 'completed' -and $_.conclusion -eq 'success' } | Select-Object -First 1
          if (!$run) { throw "No successful matching firmware build for commit $sha; refusing mixed-commit Bundle" }
          New-Item -ItemType Directory -Force 'qt_console/bundle/console','qt_console/bundle/firmware' | Out-Null
          Copy-Item 'qt_console/dist/*' 'qt_console/bundle/console/' -Recurse -Force
          gh run download $run.id --repo $repo --name "firmware-proteus-f427-$sha" --dir 'qt_console/bundle/firmware'
          if ($LASTEXITCODE -ne 0) { throw 'Firmware artifact download failed' }
          $firmware = Get-ChildItem 'qt_console/bundle/firmware' -Filter '*.bin'
          if (!$firmware) { throw 'Firmware binary missing; refusing Bundle' }
          foreach ($bin in $firmware) {
            if (!(Test-Path "$($bin.FullName).properties")) { throw "Firmware properties missing for $($bin.Name)" }
          }
          Copy-Item LICENSE 'qt_console/bundle/LICENSE.txt'
          'BENCH BUILD - not validated on physical ECU. Do not flash without verifying board, bootloader and image.' | Set-Content 'qt_console/bundle/READ-ME-FIRST.txt'
          $files = Get-ChildItem 'qt_console/bundle' -Recurse -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' }
          $hashes = $files | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.FullName.Substring((Resolve-Path 'qt_console/bundle').Path.Length + 1).Replace('\\','/'))" }
          $hashes | Set-Content -Encoding ascii 'qt_console/bundle/SHA256SUMS.txt'
          Compress-Archive -Path 'qt_console/bundle/*' -DestinationPath 'qt_console/Tunuino-Qt-F427-Bench-Bundle.zip' -CompressionLevel Optimal
      - name: Upload single Qt bench Bundle ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Tunuino-Qt-F427-Bench-Bundle
          path: qt_console/Tunuino-Qt-F427-Bench-Bundle.zip
          if-no-files-found: error
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: TunuinoConsole-Windows-x64
          path: qt_console/dist/
          if-no-files-found: error
