
name: Cleanup Releases and Tags

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DELETE ALL to confirm"
        required: true
        type: string

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ inputs.confirmation == 'DELETE ALL' }}
    runs-on: ubuntu-latest
    steps:
      - name: Delete releases and tags
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GH_REPO" != "Tunuino/Tunuino" ]]; then
            exit 1
          fi

          gh api --paginate --slurp \
            "repos/$GH_REPO/releases?per_page=100" \
            --jq '.[][] | .id' > releases.txt

          while read -r id; do
            [[ -z "$id" ]] && continue
            gh api --method DELETE \
              "repos/$GH_REPO/releases/$id"
          done < releases.txt

          gh api --paginate --slurp \
            "repos/$GH_REPO/git/matching-refs/tags" \
            --jq '.[][] | .ref' > tags.txt

          while read -r ref; do
            [[ -z "$ref" ]] && continue
            gh api --method DELETE \
              "repos/$GH_REPO/git/$ref"
          done < tags.txt

          echo "Cleanup completed"
