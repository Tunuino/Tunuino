name: Build Tunuino logo PNG
on:
  workflow_dispatch:
  push:
    paths:
      - assets/tunuino-logo.svg
      - .github/workflows/build-logo.yml
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render PNG
        run: |
          python -m pip install --quiet cairosvg
          python - <<'PY'
          import cairosvg
          cairosvg.svg2png(url="assets/tunuino-logo.svg",write_to="assets/tunuino-logo.png")
          PY
      - name: Commit PNG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/tunuino-logo.png
          if ! git diff --cached --quiet; then
            git commit -m "Render Tunuino logo PNG"
            git push
          fi
