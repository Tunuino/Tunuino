name: Tunuino dual Console v2 tests
on:
  push:
  pull_request:
jobs:
  dual-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile dual transport v2 tests
        run: cc -std=c11 -Wall -Wextra -Werror -pedantic firmware/core/console_protocol.c firmware/core/console_tx.c firmware/core/console_tx_queue.c firmware/core/console_uart_pump.c firmware/core/console_service.c firmware/core/console_partial.c firmware/core/console_partial_service.c firmware/core/tunerstudio_protocol.c firmware/core/tunerstudio_buffered.c firmware/core/dual_console_transport_v2.c tests/test_dual_console_transport_v2.c -o /tmp/tunuino_dual_v2
      - name: Run dual transport v2 tests
        run: /tmp/tunuino_dual_v2
