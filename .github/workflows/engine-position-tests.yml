name: Tunuino engine position tests
on:
  push:
  pull_request:
jobs:
  position:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile position tests
        run: cc -std=c11 -Wall -Wextra -Werror -pedantic firmware/core/trigger_60_2.c firmware/core/engine_phase.c firmware/core/engine_position.c tests/test_engine_position.c -o /tmp/tunuino_engine_position
      - name: Run position tests
        run: /tmp/tunuino_engine_position
