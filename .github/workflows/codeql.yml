name: Tunuino CodeQL
on:
  push:
    branches: [master]
    paths:
      - 'firmware/**'
      - '.github/workflows/codeql.yml'
  pull_request:
    paths:
      - 'firmware/**'
      - '.github/workflows/codeql.yml'
  workflow_dispatch:
concurrency:
  group: tunuino-codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  security-events: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        language: [cpp]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v3
