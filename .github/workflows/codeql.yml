name: Tunuino CodeQL
on:
  push:
    branches: [master]
    paths:
      - 'firmware/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - 'scripts/audit_compile_commands.py'
      - '.github/workflows/codeql.yml'
  pull_request:
    paths:
      - 'firmware/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - '.github/workflows/codeql.yml'
  workflow_dispatch:
concurrency:
  group: tunuino-codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  security-events: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        language: [cpp]
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: manual
      - name: Build native Tunuino code for CodeQL
        run: |
          cmake -S . -B build-codeql -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build build-codeql --parallel 2
      - name: Run native tests
        run: ctest --test-dir build-codeql --output-on-failure
      - name: Audit native compilation coverage
        run: python3 scripts/audit_compile_commands.py build-codeql/compile_commands.json
      - name: Upload native compilation manifest
        uses: actions/upload-artifact@v4
        with:
          name: codeql-native-compile-commands
          path: build-codeql/compile_commands.json
          retention-days: 14
      - uses: github/codeql-action/analyze@v3
        with:
          category: '/language:cpp/native'
  analyze-stm32:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Install Arm GNU Toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1.14.0
        with:
          release: '14.2.Rel1'
      - uses: github/codeql-action/init@v3
        with:
          languages: cpp
          build-mode: manual
      - name: Build STM32F429 firmware for CodeQL
        run: make -C firmware BOARD=stm32f429
      - uses: github/codeql-action/analyze@v3
        with:
          category: '/language:cpp/stm32f429'
