name: Publish Console Beta (manual)

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: 'Successful Qt Console Windows build run ID to publish'
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish-beta:
    runs-on: ubuntu-latest
    concurrency:
      group: tunuino-beta-pages
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Validate selected Windows build
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]] || { echo "Run ID must be numeric"; exit 1; }
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID")
          [[ "$(jq -r '.name' <<< "$run")" == "Qt Console Windows" ]] || { echo "Not a Console build"; exit 1; }
          [[ "$(jq -r '.head_branch' <<< "$run")" == "master" ]] || { echo "Build is not from master"; exit 1; }
          [[ "$(jq -r '.status' <<< "$run")" == "completed" ]] || { echo "Build not completed"; exit 1; }
          jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID/jobs?per_page=100")
          jq -e '[.jobs[] | select(.name == "windows-build" and .conclusion == "success")] | length == 1' <<< "$jobs"
          echo "BUILD_RUN_ID=$BUILD_RUN_ID" >> "$GITHUB_ENV"
      - name: Download tested Windows installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p installer
          gh run download "$BUILD_RUN_ID" -R "$GITHUB_REPOSITORY" -n TunuinoConsole-Setup-Windows-x64 -D installer
          shopt -s nullglob
          files=(installer/Tunuino-Console-Setup-*.exe)
          [[ ${#files[@]} -eq 1 ]] || { echo "Expected exactly one installer"; exit 1; }
          [[ -s "${files[0]}" && -s installer/SHA256SUMS.txt ]] || { echo "Installer or checksum missing"; exit 1; }
          (cd installer && sha256sum -c SHA256SUMS.txt)
      - name: Prepare public Beta manifest
        run: |
          set -euo pipefail
          mkdir -p public/updates
          file=$(basename installer/Tunuino-Console-Setup-*.exe)
          version="${file#Tunuino-Console-Setup-}"
          version="${version%.exe}"
          cp "installer/$file" "public/updates/$file"
          VERSION="$version" FILENAME="$file" python3 - <<'PY'
          import hashlib, json, os, pathlib
          p = pathlib.Path('public/updates') / os.environ['FILENAME']
          data = {
              'version': os.environ['VERSION'],
              'url': 'https://tunuino.github.io/Tunuino/updates/' + p.name,
              'sha256': hashlib.sha256(p.read_bytes()).hexdigest(),
          }
          pathlib.Path('public/updates/beta.json').write_text(
              json.dumps(data, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publish approved Beta
        id: deployment
        uses: actions/deploy-pages@v4
