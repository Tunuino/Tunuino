name: Proteus F427 USB bench

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  usb-bench:
    name: Experimental Proteus v0.7 F427 USB image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: hathach/tinyusb
          ref: 86ad6e56c1700e85f1c5678607a762cfe3aa2f47
          path: .deps/tinyusb
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: STMicroelectronics/cmsis-device-f4
          ref: 9192c7b9df75a142f2027ab266601fe061fc00b3
          path: .deps/cmsis_device
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ARM-software/CMSIS_6
          ref: acf7392d0eee2ce58a98c8e8faa793e0f13f9307
          path: .deps/cmsis_core
          persist-credentials: false
      - name: Install ARM compiler and runtime
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gcc-arm-none-eabi libnewlib-arm-none-eabi
      - name: Link and inspect USB bench image
        run: python3 tools/build_proteus_usb_bench.py --output build/proteus-v07-usb-bench
      - name: Preserve experimental image and licenses
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tunuino-proteus-v07-f427-USB-BENCH-EXPERIMENTAL
          path: |
            build/proteus-v07-usb-bench/*.elf
            build/proteus-v07-usb-bench/*.bin
            build/proteus-v07-usb-bench/*.hex
            build/proteus-v07-usb-bench/*.json
            build/proteus-v07-usb-bench/*.map
            build/proteus-v07-usb-bench/*.txt
            build/proteus-v07-usb-bench/third-party-licenses/
          if-no-files-found: error
          retention-days: 30
