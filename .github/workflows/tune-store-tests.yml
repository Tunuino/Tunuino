name: Tunuino tune store tests
on:
  push:
  pull_request:
jobs:
  tune-store:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile validated tune store tests
        run: cc -std=c11 -Wall -Wextra -Werror -pedantic firmware/core/tune_maps.c firmware/core/tune_validation.c firmware/core/tune_store.c tests/test_tune_store.c -o /tmp/tunuino_tune_store
      - name: Run store tests
        run: /tmp/tunuino_tune_store
