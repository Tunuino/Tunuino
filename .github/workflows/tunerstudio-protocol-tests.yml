name: Tunuino TunerStudio protocol tests
on:
  push:
  pull_request:
jobs:
  ts-protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile read-only protocol tests
        run: cc -std=c11 -Wall -Wextra -Werror -pedantic firmware/core/tunerstudio_protocol.c tests/test_tunerstudio_protocol.c -o /tmp/tunuino_ts_protocol
      - name: Run protocol tests
        run: /tmp/tunuino_ts_protocol
