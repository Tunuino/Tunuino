name: Tunuino Console protocol C tests
on:
  push:
  pull_request:
jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile C protocol tests
        run: cc -std=c11 -Wall -Wextra -Werror -pedantic firmware/core/console_protocol.c tests/test_console_protocol.c -o /tmp/tunuino_protocol_test
      - name: Run C protocol tests
        run: /tmp/tunuino_protocol_test
