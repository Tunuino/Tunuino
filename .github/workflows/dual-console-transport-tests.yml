name: Tunuino dual Console transport tests
on:
  push:
  pull_request:
jobs:
  dual-transport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile dual transport isolation tests
        run: cc -std=c11 -Wall -Wextra -Werror -pedantic firmware/core/console_protocol.c firmware/core/console_tx.c firmware/core/console_tx_queue.c firmware/core/console_uart_pump.c firmware/core/console_service.c firmware/core/tunerstudio_protocol.c firmware/core/tunerstudio_serial.c firmware/core/dual_console_transport.c tests/test_dual_console_transport.c -o /tmp/tunuino_dual_transport
      - name: Run isolation tests
        run: /tmp/tunuino_dual_transport
