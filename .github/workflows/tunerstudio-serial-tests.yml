name: Tunuino TunerStudio serial tests
on:
  push:
  pull_request:
jobs:
  serial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile read-only serial transport tests
        run: cc -std=c11 -Wall -Wextra -Werror -pedantic firmware/core/tunerstudio_protocol.c firmware/core/tunerstudio_serial.c tests/test_tunerstudio_serial.c -o /tmp/tunuino_ts_serial
      - name: Run transport tests
        run: /tmp/tunuino_ts_serial
