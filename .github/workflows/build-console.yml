name: Windows Console
'on':
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_call: {}
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  console:
    name: Windows Console and packaged runtime check
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: 'false'
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: '21'
        cache: maven
        cache-dependency-path: java_console/pom.xml
    - name: Compile and collect runtime dependencies
      run: mvn --batch-mode --no-transfer-progress --file java_console/pom.xml verify org.apache.maven.plugins:maven-dependency-plugin:3.8.1:copy-dependencies
        -DincludeScope=runtime -DoutputDirectory=target/app/lib "-Dtunuino.sourceCommit=${{ github.sha }}"
    - name: Firmware validation and programmer failure checks on Windows
      run: python tools/check_maintenance.py
    - name: Test the actual release JAR with simulated programmer output
      run: python tools/check_maintenance.py --jar java_console/target/tunuino-console-0.1.0-SNAPSHOT.jar
    - name: Build portable Windows application with Java runtime
      shell: pwsh
      run: |
        Copy-Item java_console/target/tunuino-console-0.1.0-SNAPSHOT.jar java_console/target/app/tunuino-console.jar
        Copy-Item LICENSE java_console/target/app/LICENSE.txt
        jpackage --type app-image --name TunuinoConsole --app-version 0.1.0 --vendor Tunuino --input java_console/target/app --main-jar tunuino-console.jar --main-class io.tunuino.console.Launcher --add-modules java.base,java.desktop,java.logging,java.naming,java.xml,java.management,jdk.unsupported,jdk.crypto.ec --jlink-options "--strip-debug --no-man-pages --no-header-files" --dest build/windows
        if ($LASTEXITCODE -ne 0) { throw 'jpackage failed' }
    - name: Verify packaged JavaFX and USB serial runtime
      shell: pwsh
      run: |
        $exe = (Resolve-Path build/windows/TunuinoConsole/TunuinoConsole.exe).Path
        $process = Start-Process -FilePath $exe -ArgumentList '--verify-runtime' -PassThru -RedirectStandardOutput runtime-check.txt -RedirectStandardError runtime-check-errors.txt
        if (-not $process.WaitForExit(60000)) {
          $process.Kill()
          throw 'Packaged runtime check timed out'
        }
        $process.Refresh()
        Get-Content runtime-check.txt
        Get-Content runtime-check-errors.txt
        if ($process.ExitCode -ne 0) { throw "Packaged runtime check failed: $($process.ExitCode)" }
    - name: Prepare offline programmer tool layout
      shell: pwsh
      run: python misc/install/package_programmer_tools.py --destination build/windows/TunuinoConsole
    - name: Verify actual interface with the packaged Java runtime
      shell: pwsh
      run: |
        $classpath = 'build/windows/TunuinoConsole/app/tunuino-console.jar;build/windows/TunuinoConsole/app/lib/*;java_console/target/test-classes'
        $runtimeJava = (Resolve-Path 'build/windows/TunuinoConsole/runtime/bin/java.exe').Path
        & $runtimeJava '-Dprism.order=sw' -cp $classpath io.tunuino.console.ConsoleUiChecks --snapshots=build/interface-check
        if ($LASTEXITCODE -ne 0) { throw 'Console interface check failed' }
    - name: Preserve interface previews
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: console-interface-${{ github.sha }}
        path: build/interface-check/
        if-no-files-found: warn
        retention-days: '30'
    - name: Record component provenance
      shell: pwsh
      run: |-
        $jar = 'build/windows/TunuinoConsole/app/tunuino-console.jar'
        $metadata = @{
         source_commit = $env:GITHUB_SHA
         run_id = $env:GITHUB_RUN_ID
         main_jar_sha256 = (Get-FileHash $jar -Algorithm SHA256).Hash.ToLowerInvariant()
         runtime_verified = $true
         physical_ecu_validation = $false
        }
        $metadata | ConvertTo-Json | Set-Content -Encoding utf8 build/windows/TunuinoConsole/package-manifest.json
    - name: Preserve portable Windows Console
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: console-windows-x64-${{ github.sha }}
        path: build/windows/TunuinoConsole/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: '30'
