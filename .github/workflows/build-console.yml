name: Tunuino Console and Java tools

on:
  push:
    paths:
      - 'java_console/**'
      - 'java_tools/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/build-console.yml'
  pull_request:
    paths:
      - 'java_console/**'
      - 'java_tools/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/build-console.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java-build-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Validate Gradle wrapper
        run: ./gradlew --version
      - name: Reject legacy Java namespaces
        run: |
          if grep -RInE 'com[.]ru[a-z]+|org[.]ru[a-z]+' java_console java_tools --include='*.java' --include='*.gradle'; then
            echo 'Legacy Java namespace found'
            exit 1
          fi
      - name: Build and test Console modules
        run: ./gradlew :logging-api:build :logging:build :branding:build :trigger-ui:build --no-daemon
      - name: Build and test Java tools
        run: ./gradlew :version:build :bin2header:build --no-daemon
      - name: Upload Java test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tunuino-java-test-results
          path: '**/build/test-results/test/*.xml'
          if-no-files-found: ignore
