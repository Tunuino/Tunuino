plugins { id 'application' }
dependencies { implementation project(':java_console') }
application { mainClass = 'io.tunuino.tools.Tools' }
tasks.register('toolChecks', JavaExec) {
    dependsOn testClasses, ':buildSimulator'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.tunuino.tools.ToolChecks'
    args rootProject.file('build/simulator/tunuino-simulator' + (System.getProperty('os.name').toLowerCase().contains('windows') ? '.exe' : ''))
}
tasks.named('check') { dependsOn 'toolChecks' }
