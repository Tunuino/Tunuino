; Tunuino Proteus v0.7 / STM32F427. Read-only USB bench, firmware 0.0.3.
; Use the firmware and INI from the same Bundle. No engine sensors or tuning.
enable2ndByteCanID = false

[TunerStudio]
    iniSpecVersion = 3.51
    iniVersion = @@INI_REVISION@@
    signature = @@SIGNATURE@@
    queryCommand = "S"
    versionInfo = "V"
    defaultRuntimeRecordPerSec = 5

[Constants]
    messageEnvelopeFormat = msEnvelope_1.0
    endianness = big
    nPages = 1
    pageSize = 1
    pageReadCommand = "R"
    burnCommand = ""
    pageValueWrite = ""
    pageChunkWrite = ""
    blockingFactor = 64
    blockReadTimeout = 1000
    interWriteDelay = 0
    page = 1
    layoutRevision = scalar, U08, 0, "", 1, 0, 1, 1, 0

[ConstantExtensions]
    readOnly = layoutRevision

[OutputChannels]
@@CHANNELS@@
[GaugeConfigurations]
@@GAUGES@@
[FrontPage]
@@FRONT_PAGE@@
[Menu]
@@MENU@@