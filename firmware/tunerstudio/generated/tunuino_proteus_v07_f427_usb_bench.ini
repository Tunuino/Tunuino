; Generated by firmware/tunerstudio/generate.py; edit schema/template/fragments.
; Tunuino Proteus v0.7 / STM32F427. Read-only USB bench, firmware 0.0.3.
; Use the firmware and INI from the same Bundle. No engine sensors or tuning.
enable2ndByteCanID = false

[TunerStudio]
    iniSpecVersion = 3.51
    iniVersion = 2
    signature = "Tunuino Proteus v0.7 F427 USB bench v1"
    queryCommand = "S"
    versionInfo = "V"
    defaultRuntimeRecordPerSec = 5

[Constants]
    messageEnvelopeFormat = msEnvelope_1.0
    endianness = big
    nPages = 1
    pageSize = 1
    pageReadCommand = "R"
    burnCommand = ""
    pageValueWrite = ""
    pageChunkWrite = ""
    blockingFactor = 64
    blockReadTimeout = 1000
    interWriteDelay = 0
    page = 1
    layoutRevision = scalar, U08, 0, "", 1, 0, 1, 1, 0

[ConstantExtensions]
    readOnly = layoutRevision

[OutputChannels]
    ochGetCommand = "A"
    ochBlockSize = 31
    ; Big-endian identity block after the envelope status byte.
    protocolRevision = scalar, U08, 7, "", 1, 0
    boardFamily = scalar, U08, 8, "", 1, 0
    mcuSeries = scalar, U08, 9, "", 1, 0
    hardwareRevision = scalar, U16, 10, "", 1, 0
    firmwareMajor = scalar, U08, 12, "", 1, 0
    firmwareMinor = scalar, U08, 13, "", 1, 0
    firmwarePatch = scalar, U08, 14, "", 1, 0
    capabilities = scalar, U32, 15, "", 1, 0
    uidWord1 = scalar, U32, 19, "", 1, 0
    uidWord2 = scalar, U32, 23, "", 1, 0
    uidWord3 = scalar, U32, 27, "", 1, 0
    time = { timeNow }, "s"

[GaugeConfigurations]
    gaugeCategory = "Tunuino USB bench"
    protocolGauge = protocolRevision, "Identity protocol", "", 0, 10, 0, 0, 10, 10, 0, 0
    familyGauge = boardFamily, "Board family (1=Proteus)", "", 0, 3, 0, 0, 3, 3, 0, 0
    mcuGauge = mcuSeries, "MCU series (1=F4)", "", 0, 4, 0, 0, 4, 4, 0, 0
    revisionGauge = hardwareRevision, "Hardware revision", "", 0, 10, 0, 0, 10, 10, 0, 0
    majorGauge = firmwareMajor, "Firmware major", "", 0, 10, 0, 0, 10, 10, 0, 0
    minorGauge = firmwareMinor, "Firmware minor", "", 0, 10, 0, 0, 10, 10, 0, 0
    patchGauge = firmwarePatch, "Firmware patch", "", 0, 10, 0, 0, 10, 10, 0, 0
    capabilitiesGauge = capabilities, "Engine capabilities", "", 0, 31, 0, 0, 31, 31, 0, 0
    uid1Gauge = uidWord1, "STM32 UID word 1", "", 0, 4294967295, 0, 0, 4294967295, 4294967295, 0, 0
    uid2Gauge = uidWord2, "STM32 UID word 2", "", 0, 4294967295, 0, 0, 4294967295, 4294967295, 0, 0
    uid3Gauge = uidWord3, "STM32 UID word 3", "", 0, 4294967295, 0, 0, 4294967295, 4294967295, 0, 0

[FrontPage]
    gauge1 = protocolGauge
    gauge2 = familyGauge
    gauge3 = mcuGauge
    gauge4 = revisionGauge
    gauge5 = majorGauge
    gauge6 = minorGauge
    gauge7 = patchGauge
    gauge8 = capabilitiesGauge

[Menu]
    menuDialog = main
    menu = "Tunuino"
        subMenu = benchInfo, "Proteus USB bench"

[UiDialogs]
    dialog = benchInfo, "Tunuino Proteus v0.7 / F427"
        field = "INI layout revision", layoutRevision
        gauge = uid1Gauge
        gauge = uid2Gauge
        gauge = uid3Gauge

[Datalog]
    entry = time, "Time", float, "%.3f"
    entry = hardwareRevision, "Hardware revision", int, "%d"
    entry = firmwareMajor, "Firmware major", int, "%d"
    entry = firmwareMinor, "Firmware minor", int, "%d"
    entry = firmwarePatch, "Firmware patch", int, "%d"
    entry = capabilities, "Engine capabilities", int, "%d"
