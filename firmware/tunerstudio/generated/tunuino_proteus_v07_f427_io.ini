; Copyright (c) 2026 Tunuino. Generated by generate_io.py.
; Physical input/calibration bench. No actuator commands or engine control.
; Disabled/unavailable calibrated channels evaluate to NaN, not measurements.
enable2ndByteCanID = false

[TunerStudio]
    iniSpecVersion = 3.51
    iniVersion = 4
    signature = "Tunuino Proteus v0.7 F427 IO v1"
    queryCommand = "S"
    versionInfo = "V"
    defaultRuntimeRecordPerSec = 5

[Constants]
    messageEnvelopeFormat = msEnvelope_1.0
    endianness = big
    nPages = 3
    pageSize = 256, 160, 160
    pageIdentifier = "\x00\x01", "\x00\x02", "\x00\x03"
    pageReadCommand = "r%2i%2o%2c", "r%2i%2o%2c", "r%2i%2o%2c"
    pageValueWrite = "w%2i%2o%2c%v", "w%2i%2o%2c%v", "w%2i%2o%2c%v"
    pageChunkWrite = "w%2i%2o%2c%v", "w%2i%2o%2c%v", "w%2i%2o%2c%v"
    burnCommand = "b%2i", "b%2i", "b%2i"
    crc32CheckCommand = "k%2i", "k%2i", "k%2i"
    blockingFactor = 100
    blockReadTimeout = 6000
    interWriteDelay = 0
    page = 1
    configLayout = scalar, U16, 0, "", 1, 0, 1, 1, 0
    triggerEnabled = bits, U08, 2, [0:0], "Disabled", "Enabled"
    triggerTeeth = scalar, U08, 3, "teeth", 1, 0, 4, 120, 0
    triggerMissing = scalar, U08, 4, "teeth", 1, 0, 1, 59, 0
    mapInput = bits, U08, 6, [0:3], "Disabled", "AV1", "AV2", "AV3", "AV4", "AV5", "AV6", "AV7", "AV8", "AV9", "AV10", "AV11"
    lambdaInput = bits, U08, 7, [0:3], "Disabled", "AV1", "AV2", "AV3", "AV4", "AV5", "AV6", "AV7", "AV8", "AV9", "AV10", "AV11"
    coolantInput = bits, U08, 8, [0:2], "Disabled", "AT1", "AT2", "AT3", "AT4"
    mapRawLow = scalar, U16, 10, "ADC", 1, 0, 0, 4095, 0
    mapRawHigh = scalar, U16, 12, "ADC", 1, 0, 1, 4095, 0
    mapLow = scalar, U16, 14, "kPa", 0.01, 0, 0, 500, 2
    mapHigh = scalar, U16, 16, "kPa", 0.01, 0, 0, 500, 2
    lambdaRawLow = scalar, U16, 18, "ADC", 1, 0, 0, 4095, 0
    lambdaRawHigh = scalar, U16, 20, "ADC", 1, 0, 1, 4095, 0
    lambdaLow = scalar, U16, 22, "lambda", 0.001, 0, 0, 5, 3
    lambdaHigh = scalar, U16, 24, "lambda", 0.001, 0, 0, 5, 3
    coolantCount = scalar, U08, 26, "", 1, 0, 3, 3, 0
    maximumRpm = scalar, U16, 96, "rpm", 1, 0, 1000, 20000, 0
    adcReference = scalar, U16, 100, "mV", 1, 0, 2800, 3600, 0
    coolantRaw = array, U16, 32, [3], "ADC", 1, 0, 0, 4095, 0
    coolantTemp = array, S16, 64, [3], "C", 0.01, 0, -40, 150, 2
    page = 2
    veRpm = array, U16, 0, [8], "rpm", 1, 0, 0, 20000, 0
    veLoad = array, U16, 16, [8], "kPa", 0.01, 0, 0, 500, 2
    veCells = array, S16, 32, [8x8], "%", 0.01, 0, 0, 300, 2
    page = 3
    ignitionRpm = array, U16, 0, [8], "rpm", 1, 0, 0, 20000, 0
    ignitionLoad = array, U16, 16, [8], "kPa", 0.01, 0, 0, 500, 2
    ignitionCells = array, S16, 32, [8x8], "deg BTDC", 0.01, 0, -90, 90, 2

[ConstantExtensions]
    readOnly = configLayout
    readOnly = coolantCount

[OutputChannels]
    ochGetCommand = "O%2o%2c"
    ochBlockSize = 100
    protocolRevision = scalar, U08, 7, "", 1, 0
    boardFamily = scalar, U08, 8, "", 1, 0
    mcuSeries = scalar, U08, 9, "", 1, 0
    hardwareRevision = scalar, U16, 10, "", 1, 0
    firmwareMajor = scalar, U08, 12, "", 1, 0
    firmwareMinor = scalar, U08, 13, "", 1, 0
    firmwarePatch = scalar, U08, 14, "", 1, 0
    capabilities = scalar, U32, 15, "", 1, 0
    uidWord1 = scalar, U32, 19, "", 1, 0
    uidWord2 = scalar, U32, 23, "", 1, 0
    uidWord3 = scalar, U32, 27, "", 1, 0
    uptimeSeconds = scalar, U32, 32, "s", 1, 0
    uptimeMillis = scalar, U16, 36, "ms", 1, 0
    validMask = scalar, U08, 38, "", 1, 0
    ioStatus = scalar, U08, 39, "", 1, 0
    rpmValue = scalar, U32, 40, "rpm", 0.001, 0
    mapValue = scalar, U32, 44, "kPa", 0.001, 0
    lambdaValue = scalar, U32, 48, "lambda", 1e-06, 0
    coolantValue = scalar, S32, 52, "C", 0.001, 0
    configGeneration = scalar, U32, 56, "", 1, 0
    adcReferenceMv = scalar, U16, 92, "mV", 1, 0
    triggerTooth = scalar, U16, 94, "", 1, 0
    triggerErrors = scalar, U32, 96, "", 1, 0
    raw1 = scalar, U16, 60, "ADC", 1, 0
    raw2 = scalar, U16, 62, "ADC", 1, 0
    raw3 = scalar, U16, 64, "ADC", 1, 0
    raw4 = scalar, U16, 66, "ADC", 1, 0
    raw5 = scalar, U16, 68, "ADC", 1, 0
    raw6 = scalar, U16, 70, "ADC", 1, 0
    raw7 = scalar, U16, 72, "ADC", 1, 0
    raw8 = scalar, U16, 74, "ADC", 1, 0
    raw9 = scalar, U16, 76, "ADC", 1, 0
    raw10 = scalar, U16, 78, "ADC", 1, 0
    raw11 = scalar, U16, 80, "ADC", 1, 0
    raw12 = scalar, U16, 82, "ADC", 1, 0
    raw13 = scalar, U16, 84, "ADC", 1, 0
    raw14 = scalar, U16, 86, "ADC", 1, 0
    raw15 = scalar, U16, 88, "ADC", 1, 0
    raw16 = scalar, U16, 90, "ADC", 1, 0
    time = { uptimeSeconds + uptimeMillis / 1000.0 }, "s"
    rpm = { (validMask & 1) != 0 ? rpmValue : (0.0 / 0.0) }, "rpm"
    map = { (validMask & 2) != 0 ? mapValue : (0.0 / 0.0) }, "kPa"
    lambda = { (validMask & 4) != 0 ? lambdaValue : (0.0 / 0.0) }, "lambda"
    coolant = { (validMask & 8) != 0 ? coolantValue : (0.0 / 0.0) }, "C"
    adc1 = { (ioStatus & 1) != 0 ? raw1 * adcReferenceMv / 4095000.0 : (0.0 / 0.0) }, "V"
    adc2 = { (ioStatus & 1) != 0 ? raw2 * adcReferenceMv / 4095000.0 : (0.0 / 0.0) }, "V"
    adc3 = { (ioStatus & 1) != 0 ? raw3 * adcReferenceMv / 4095000.0 : (0.0 / 0.0) }, "V"
    adc4 = { (ioStatus & 1) != 0 ? raw4 * adcReferenceMv / 4095000.0 : (0.0 / 0.0) }, "V"
    adc5 = { (ioStatus & 1) != 0 ? raw5 * adcReferenceMv / 4095000.0 : (0.0 / 0.0) }, "V"
    adc6 = { (ioStatus & 1) != 0 ? raw6 * adcReferenceMv / 4095000.0 : (0.0 / 0.0) }, "V"
    adc7 = { (ioStatus & 1) != 0 ? raw7 * adcReferenceMv / 4095000.0 : (0.0 / 0.0) }, "V"
    adc8 = { (ioStatus & 1) != 0 ? raw8 * adcReferenceMv / 4095000.0 : (0.0 / 0.0) }, "V"
    adc9 = { (ioStatus & 1) != 0 ? raw9 * adcReferenceMv / 4095000.0 : (0.0 / 0.0) }, "V"
    adc10 = { (ioStatus & 1) != 0 ? raw10 * adcReferenceMv / 4095000.0 : (0.0 / 0.0) }, "V"
    adc11 = { (ioStatus & 1) != 0 ? raw11 * adcReferenceMv / 4095000.0 : (0.0 / 0.0) }, "V"
    adc12 = { (ioStatus & 1) != 0 ? raw12 * adcReferenceMv / 4095000.0 : (0.0 / 0.0) }, "V"
    adc13 = { (ioStatus & 1) != 0 ? raw13 * adcReferenceMv / 4095000.0 : (0.0 / 0.0) }, "V"
    adc14 = { (ioStatus & 1) != 0 ? raw14 * adcReferenceMv / 4095000.0 : (0.0 / 0.0) }, "V"
    adc15 = { (ioStatus & 1) != 0 ? raw15 * adcReferenceMv / 4095000.0 : (0.0 / 0.0) }, "V"
    adc16 = { (ioStatus & 1) != 0 ? raw16 * adcReferenceMv / 4095000.0 : (0.0 / 0.0) }, "V"

[CurveEditor]
    curve = coolantCurve, "Coolant calibration: measured ADC / temperature"
        columnLabel = "ADC", "C"
        xAxis = 0, 4095, 3
        yAxis = -40, 150, 10
        xBins = coolantRaw, "ADC"
        yBins = coolantTemp, "C"
        showTextValues = true

[TableEditor]
    table = veTable, veMap, "VE calibration - stored only", 2
        xBins = veRpm, rpm
        yBins = veLoad, map
        zBins = veCells
        gridOrient = 250, 0, 340
    table = ignitionTable, ignitionMap, "Ignition calibration - stored only", 3
        xBins = ignitionRpm, rpm
        yBins = ignitionLoad, map
        zBins = ignitionCells
        gridOrient = 250, 0, 340

[GaugeConfigurations]
    gaugeCategory = "Tunuino IO bench"
    rpmGauge = rpm, "RPM", "rpm", 0, 12000, 0, 0, 10000, 12000, 0, 0
    mapGauge = map, "MAP", "kPa", 0, 300, 0, 0, 250, 300, 2, 2
    lambdaGauge = lambda, "Lambda", "lambda", 0.5, 1.5, 0.6, 0.7, 1.3, 1.4, 3, 3
    coolantGauge = coolant, "Coolant", "C", -40, 150, -40, -30, 120, 140, 1, 1
    uptimeGauge = time, "ECU uptime", "s", 0, 3600, 0, 0, 3600, 3600, 1, 1
    validityGauge = validMask, "Sensor validity mask", "", 0, 15, 0, 0, 15, 15, 0, 0
    adc1Gauge = adc1, "AV1 ADC", "V", 0, 3.6, 0, 0, 3.5, 3.6, 3, 3
    adc2Gauge = adc2, "AV2 ADC", "V", 0, 3.6, 0, 0, 3.5, 3.6, 3, 3
    adc3Gauge = adc3, "AV3 ADC", "V", 0, 3.6, 0, 0, 3.5, 3.6, 3, 3
    adc4Gauge = adc4, "AV4 ADC", "V", 0, 3.6, 0, 0, 3.5, 3.6, 3, 3
    adc5Gauge = adc5, "AV5 ADC", "V", 0, 3.6, 0, 0, 3.5, 3.6, 3, 3
    adc6Gauge = adc6, "AV6 ADC", "V", 0, 3.6, 0, 0, 3.5, 3.6, 3, 3
    adc7Gauge = adc7, "AV7 ADC", "V", 0, 3.6, 0, 0, 3.5, 3.6, 3, 3
    adc8Gauge = adc8, "AV8 ADC", "V", 0, 3.6, 0, 0, 3.5, 3.6, 3, 3
    adc9Gauge = adc9, "AV9 ADC", "V", 0, 3.6, 0, 0, 3.5, 3.6, 3, 3
    adc10Gauge = adc10, "AV10 ADC", "V", 0, 3.6, 0, 0, 3.5, 3.6, 3, 3
    adc11Gauge = adc11, "AV11 ADC", "V", 0, 3.6, 0, 0, 3.5, 3.6, 3, 3
    adc12Gauge = adc12, "12V divided (MCU) ADC", "V", 0, 3.6, 0, 0, 3.5, 3.6, 3, 3
    adc13Gauge = adc13, "AT1 ADC", "V", 0, 3.6, 0, 0, 3.5, 3.6, 3, 3
    adc14Gauge = adc14, "AT2 ADC", "V", 0, 3.6, 0, 0, 3.5, 3.6, 3, 3
    adc15Gauge = adc15, "AT3 ADC", "V", 0, 3.6, 0, 0, 3.5, 3.6, 3, 3
    adc16Gauge = adc16, "AT4 ADC", "V", 0, 3.6, 0, 0, 3.5, 3.6, 3, 3

[FrontPage]
    gauge1 = rpmGauge
    gauge2 = mapGauge
    gauge3 = lambdaGauge
    gauge4 = coolantGauge
    gauge5 = uptimeGauge
    gauge6 = validityGauge
    gauge7 = adc1Gauge
    gauge8 = adc13Gauge

[Menu]
    menuDialog = main
    menu = "Tunuino"
        subMenu = inputSetup, "Inputs and wheel"
        subMenu = mapCalibration, "MAP calibration"
        subMenu = lambdaCalibration, "Lambda calibration"
        subMenu = coolantCurve, "Coolant curve"
        subMenu = rawInputs, "Raw analog inputs"
        subMenu = veTable, "VE table"
        subMenu = ignitionTable, "Ignition table"

[UiDialogs]
    dialog = inputSetup, "Tunuino input acquisition"
        field = "Input/calibration bench. No engine outputs are configured."
        field = "Use measured calibration data before selecting sensor inputs."
        field = "Crank PE7, cam PE8, rising edge, missing-tooth wheel."
        field = "Acquisition", triggerEnabled
        field = "Wheel slots including missing", triggerTeeth
        field = "Missing teeth", triggerMissing
        field = "Maximum RPM", maximumRpm
        field = "MAP channel", mapInput
        field = "Lambda channel", lambdaInput
        field = "Coolant channel", coolantInput
        field = "ADC reference (measured)", adcReference
    dialog = mapCalibration, "MAP sensor calibration"
        field = "Use ADC counts measured on this ECU and values from the sensor/controller specification."
        field = "Low ADC", mapRawLow
        field = "High ADC", mapRawHigh
        field = "Value at low ADC", mapLow
        field = "Value at high ADC", mapHigh
    dialog = lambdaCalibration, "Wideband analog output calibration"
        field = "Use ADC counts measured on this ECU and values from the sensor/controller specification."
        field = "Low ADC", lambdaRawLow
        field = "High ADC", lambdaRawHigh
        field = "Value at low ADC", lambdaLow
        field = "Value at high ADC", lambdaHigh
    dialog = rawInputs, "Tunuino ADC inputs"
        field = "Voltages at MCU ADC pins. External divider ratios are not applied."
        gauge = adc1Gauge
        gauge = adc2Gauge
        gauge = adc3Gauge
        gauge = adc4Gauge
        gauge = adc5Gauge
        gauge = adc6Gauge
        gauge = adc7Gauge
        gauge = adc8Gauge
        gauge = adc9Gauge
        gauge = adc10Gauge
        gauge = adc11Gauge
        gauge = adc12Gauge
        gauge = adc13Gauge
        gauge = adc14Gauge
        gauge = adc15Gauge
        gauge = adc16Gauge

[Datalog]
    entry = time, "Time", float, "%.3f"
    entry = rpm, "RPM", float, "%.3f"
    entry = map, "MAP kPa", float, "%.3f"
    entry = lambda, "Lambda", float, "%.3f"
    entry = coolant, "Coolant C", float, "%.3f"
    entry = validMask, "Sensor validity", float, "%.3f"
    entry = ioStatus, "IO status", float, "%.3f"
    entry = triggerErrors, "Trigger errors", float, "%.3f"
    entry = adc1, "AV1 ADC V", float, "%.3f"
    entry = adc2, "AV2 ADC V", float, "%.3f"
    entry = adc3, "AV3 ADC V", float, "%.3f"
    entry = adc4, "AV4 ADC V", float, "%.3f"
    entry = adc5, "AV5 ADC V", float, "%.3f"
    entry = adc6, "AV6 ADC V", float, "%.3f"
    entry = adc7, "AV7 ADC V", float, "%.3f"
    entry = adc8, "AV8 ADC V", float, "%.3f"
    entry = adc9, "AV9 ADC V", float, "%.3f"
    entry = adc10, "AV10 ADC V", float, "%.3f"
    entry = adc11, "AV11 ADC V", float, "%.3f"
