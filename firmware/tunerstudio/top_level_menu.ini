    menuDialog = main
    menu = "Tunuino"
        subMenu = benchInfo, "Proteus USB bench"

[UserDefined]
    dialog = benchInfo, "Tunuino Proteus v0.7 / F427"
        field = "Read-only USB bench - firmware 0.0.3"
        field = "INI layout revision", layoutRevision
        field = "Identification and USB communication only."
        field = "Engine sensors, fuel and ignition maps are not available."
        field = "Close Tunuino Console's COM connection before connecting here."
        gauge = uid1Gauge
        gauge = uid2Gauge
        gauge = uid3Gauge

[Datalog]
    entry = time, "Time", float, "%.3f"
    entry = hardwareRevision, "Hardware revision", int, "%d"
    entry = firmwareMajor, "Firmware major", int, "%d"
    entry = firmwareMinor, "Firmware minor", int, "%d"
    entry = firmwarePatch, "Firmware patch", int, "%d"
    entry = capabilities, "Engine capabilities", int, "%d"
